<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Server</title>
    <link rel="stylesheet" href="/static/CSS/load_to_game_1.css">
    <script src="/static/JavaScript/home.js" type="module"></script>
    <script src="/static/JavaScript/profile.js" defer></script>
    <script src="/static/JavaScript/music-player.js" defer></script>
</head>
<body>
    <canvas id="tankCanvas"></canvas>

    <!-- 🔹 Кнопка профілю -->
    <div class="profile-container">
        <button class="profile-button">Profile</button>
    </div>

    <!-- 🔹 Заголовок та кнопки -->
    <div class="overlay">
        <h1>Test Place</h1>
        <div class="button-container">
            <a href="/templates/load_to_game_2.html" class="pixel-button">Play</a>
            <a href="/templates/load_to_game_2.2.html" class="pixel-button">Multiplayer</a>
        </div>
    </div>

    <!-- 🔹 Модальне вікно профілю -->
    <div id="profileModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Player Profile</h2>
            <div class="modal-profile-container">
                <!-- 🔸 Інформація про гравця -->
                <div class="modal-section" id="player-info-block">
                    <div class="player-info">
                        <p><strong>Email:</strong> <span id="player-email">player@example.com</span></p>
                        <p><strong>Username:</strong> <span id="player-name">Player123</span></p>
                        <p><strong>Score:</strong> <span id="player-score">1500</span></p>
                        <p><strong>Place in Leaderboard:</strong> <span id="Place-In-Leaderboard">1</span></p>
                    </div>                    
                    <button class="change-view-button" onclick="togglePasswordForm(true)">Change Password</button>
                </div>

                <!-- 🔸 Форма зміни паролю -->
                <div class="modal-section hidden" id="password-form-block">
                    <form class="password-change-form">
                        <div class="password-field">
                            <input type="password" placeholder="Old Password" required>
                            <button type="button" class="toggle-password">👁</button>
                        </div>
                        <div class="password-field">
                            <input type="password" placeholder="New Password" required>
                            <button type="button" class="toggle-password">👁</button>
                        </div>
                        <div class="password-field">
                            <input type="password" placeholder="Confirm Password" required>
                            <button type="button" class="toggle-password">👁</button>
                        </div>
                        <button type="submit" class="change-password-button">Submit</button>
                    </form>
                    <button class="change-view-button" onclick="togglePasswordForm(false)">Back</button>
                </div>
            </div>

            <div class="logout-wrapper">
                <button class="logout-button" onclick="handleLogout()">Log Out</button>
            </div>
        </div>
    </div>

    <div id="music-player" style="position: fixed; bottom: 20px; left: 20px; z-index: 999; background: rgba(0,0,0,0.6); padding: 10px 15px; border-radius: 12px;">
        <span id="track-name" style="color: #fff; margin-right: 10px;">Now playing: Track 1</span>
        <button id="play-btn" class="music-btn">▶︎</button>
        <button id="next-btn" class="music-btn">⏭</button>
        <button id="mute-btn" class="music-btn muted">🔈</button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1" style="vertical-align: middle;">
        <audio id="audio-player"></audio>
    </div>

    
</body>
</html>
